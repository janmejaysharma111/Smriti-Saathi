[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smriti-saathi-api"
version = "0.1.0"
description = "FastAPI backend for Smriti Saathi accounts, care-team relationships, and scores"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "pydantic[email]>=2.8,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "PyJWT>=2.9,<3.0",
    "python-multipart>=0.0.12,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
